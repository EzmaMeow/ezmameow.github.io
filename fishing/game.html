<!doctype html>

<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        /* Container that holds all images */
        .level-container {
            position: relative;
            width: 100%;
            /* Responsive width */
            /* max-width: 800px;*/
            margin: auto;
        }

        /* Main large image */
        .background-image {
            width: 100%;
            height: auto;
            display: block;
            user-drag: none;
            -webkit-user-drag: none;
        }
    </style>
    <link rel="icon" href="/assets/anim_profile_pic.gif" type="image/x-icon">
</head>

<body>

    <div id="nav">
        <ul>
            <li><a href="/index.html">Home</a></li>
            <li><a href="/posts.html#type=media">Media</a></li>
            <li><a href="/posts.html#type=projects">Projects</a></li>
            <li><a href="/posts.html#type=posts">Posts</a></li>
            <li><a href="/contact.html">Contact</a></li>
            <li><a class="active" href="./fishing.html">Fishing</a></li>
        </ul>
    </div>

    <div id="background">
    </div>

    <div id="body_container">
        <div class="container text-center">
            <b>Radio Player</b><br>
            <audio id="radioAudio" preload="none"></audio>
            <button id="toggleRadio">Waiting</button>
            <details>
                <summary>Radio Options</summary><br>
                <label>Use Local Storage: <input type="checkbox" class="radioOptions" data-property="useLocalStorage"
                        title="Uses localStorage to store options untill cleared."></label><br>
                <label>Autoplay: <input type="checkbox" class="radioOptions" data-property="autoplay"></label><br><br>
                Volume: <input type="range" min="0" max="1" step="0.01" value="0.5" class="radioOptions"
                    data-property="volume" style="width: 75%;"><br><br>
                Url: <input type="text" id="streamUrl"
                    placeholder="Enter stream URL (e.g. http://...) or radio garden channel id"
                    value="https://radio.garden/listen/wcpe-the-classical-station/dNa5l6AK" style="width:75%;"
                    class="radioOptions" data-property="src">
                <button id="radioDefaultStation">⟲</button>
            </details>
        </div>
        <div class="flex-break"></div>

        <div class="info_container">
            <div class="info_title">
                <h1 id='room_name'>Game</h1>
            </div>
            <div class="info_content">
                <p class='text-center'>
                    Info
                </p>

            </div>
            <div class="level-container" id="world">

            </div>
        </div>
    </div>

    <audio id="splash_sound" src="/assets/splash.wav"></audio>
    <audio id="quick_splash_sound" src="/assets/quick_splash.wav"></audio>

    <script type="module" src="/radio_player.js"></script>
    <script type="module">
        import { Renderer } from "./renderer.js"
        import { RenderObjectManager, RenderObject, ImageRenderObject, OrthogonalCamera } from "./render_object_manager.js"

        const scene_container = document.getElementById('world')
        const scene_canvas = document.createElement("canvas");

        const test_image = new Image();
        test_image.src = "/assets/anim_profile_pic.gif";
        const test_background_image = new Image();
        test_background_image.src = "/assets/background.jpg";
        //const test_camera = new PerspectiveCamera()
        const test_camera = new OrthogonalCamera(1.25,1.25)
        const test_object = new ImageRenderObject(test_image, 32, 32);
        const test_background = new ImageRenderObject(test_background_image, 320, 320);
        test_background.layer = -1;


        const test_objectA = new ImageRenderObject(test_image, 32, 32);
        test_objectA.setPosition(32,32,1)
        test_objectA.onClick = function () { console.log('meowA depth 1.0') }
        test_objectA.capabilityFlags |= test_objectA.CAPABILITY_FLAGS.CLICKABLE;
        const test_objectB = new ImageRenderObject(test_image, 32, 32);
        test_objectB.setPosition(32,32,2)
        test_objectB.onClick = function () { console.log('meowB depth 2.0') }
        test_objectB.capabilityFlags |= test_objectB.CAPABILITY_FLAGS.CLICKABLE;
        const test_objectC = new ImageRenderObject(test_image, 32, 32);
        test_objectC.setPosition(32,32,0.5)
        test_objectC.onClick = function () { console.log('meowC depth 0.5') }
        test_objectC.capabilityFlags |= test_objectC.CAPABILITY_FLAGS.CLICKABLE;
        const test_objectD = new ImageRenderObject(test_image, 32, 32);
        test_objectD.setPosition(32,32,1.5)
        test_objectD.onClick = function () { console.log('meowD depth 1.5') }
        test_objectD.capabilityFlags |= test_objectD.CAPABILITY_FLAGS.CLICKABLE;


        test_object.setScale(1.0,1.0)
        const render_object_manager = new RenderObjectManager();
        const renderer = new Renderer();
        renderer.renderObjectManager = render_object_manager;
        renderer.camera = test_camera;

        render_object_manager.add(test_background);
        render_object_manager.add(test_object);

        render_object_manager.add(test_objectA);
        render_object_manager.add(test_objectB);
        render_object_manager.add(test_objectC);
        render_object_manager.add(test_objectD);

        function resize_canvas() {
            const rect = scene_container.getBoundingClientRect();
            scene_canvas.width = rect.width;
            scene_canvas.height = rect.width; //keep it square, but may need to define a min size
        }

        //scene_canvas.id = "myCanvas";
        scene_canvas.style.border = "1px solid black";
        scene_canvas.style.width = 'calc(100% - 2px)'//this corrects offsets applied via borders and such, just rember it draws to the bottom right so things get push in the direction

        //NOTE: if a camera is used, it also need to have it dim adjusted. also the viewport too if it not reading the canvas directly per update
        resize_canvas()

        scene_container.appendChild(scene_canvas);
        test_object.onImageLoaded = function () {
            test_object.onClick = function () { console.log('meow') }
            test_object.capabilityFlags |= test_object.CAPABILITY_FLAGS.CLICKABLE;
        }
        test_background.onImageLoaded = function () {
            //NOTE: the issues is not really with how it rendering, but the check is base on the object's hight/width than what it is overlaping with
            //so offseting itself by the width/hight wont work since the diffrence is base on itself at the time of sorting
            test_background.xRenderOffset = test_background.width;
            test_background.yRenderOffset = test_background.height;
        }



        //note: window.ResizeObserver may be useful too
        window.addEventListener('resize', resize_canvas);

        const playerPosition = new Float32Array(3);
        const cameraPosition = new Float32Array(3);
        document.addEventListener('keydown', function (event) {
            let changed = false
            // event.key will be one of: "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"
            test_object.getPosition(playerPosition);
            switch (event.key) {
                case 'ArrowUp':
                    //test_object.posY += 8
                    //test_camera.y -= 8
                    cameraPosition[1] +=8
                    break;
                case 'ArrowDown':
                    //test_camera.y += 8
                    cameraPosition[1] -=8
                    break;
                case 'ArrowLeft':
                    //test_camera.x -= 8
                    cameraPosition[0] +=8
                    break;
                case 'ArrowRight':
                    //test_camera.x += 8
                    cameraPosition[0] -=8
                    break;
                case 'w':
                    playerPosition[1] -= 8
                    //test_object.posY -= 8
                    break;
                case 's':
                    playerPosition[1] += 8
                    //test_object.posY += 8
                    break;
                case 'a':
                    playerPosition[0] -= 8
                    //test_object.posX -= 8
                    break;
                case 'd':
                    playerPosition[0] += 8
                    //test_object.posX += 8
                    break;
                default:
                    // Ignore other keys
                    return;
            }
            //TODO: an actual object would have a move function or similar that handles the add position logic than just setting it.
            //could add it to the render object, but they are ment to be fix and moved by their owner
            //also this logic should be done at the end of frame or begining, but currently not using a render loop
            test_object.setPosition(playerPosition[0],playerPosition[1],playerPosition[2])
            test_camera.setPosition(cameraPosition[0],cameraPosition[1],cameraPosition[2])
        })

        scene_canvas.addEventListener('click', function (event) {
            const rect = scene_canvas.getBoundingClientRect();

            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            render_object_manager.onClick(x,y,Infinity,10,renderer.camera)
        })

        function update(){
            renderer.render(scene_canvas)
            requestAnimationFrame(() => update());
        }
        update();
        

    </script>


</body>

</html>
